<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trades</title>
<style>
  :root{--bg:#0d0f12;--card:#15181d;--line:#252a33;--fg:#e7ebf0;
        --dim:#8b93a1;--faint:#5b6472;--up:#3ddc97;--dn:#ff5c72;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  .sub{color:var(--faint);font-size:12.5px;margin-top:6px;max-width:820px}
  main{padding:18px 22px 60px;max-width:1500px}
  .t{background:var(--card);border:1px solid var(--line);border-radius:12px;
     margin-bottom:22px;overflow:hidden}
  .hd{padding:11px 16px;display:flex;gap:14px;align-items:baseline;
      border-bottom:1px solid var(--line);flex-wrap:wrap}
  .hd .s{font:700 15px var(--mono)}
  .hd .b{color:var(--dim);font-family:var(--mono);font-size:12.5px}
  .pl{font:700 15px var(--mono);margin-left:auto}
  .pl.up{color:var(--up)} .pl.dn{color:var(--dn)}
  img{width:100%;display:block}
  .note{padding:10px 16px;color:var(--dim);font-size:12.5px;
        border-top:1px solid var(--line)}
  .key{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;
       color:var(--dim)}
  .sw{display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:2px}
</style>
</head>
<body>
<header>
  <h1>What the rider test actually traded</h1>
  <div class="sub">
    One trade per ride: enter at the first touch near the 12 EMA once armed,
    hold until a candle body closes below it. Six examples — the worst, the
    median and the best from BTC and ETH on the 1h.
    <div class="key">
      <span class="sw"><span class="dot" style="background:#3ddc97"></span>buy</span>
      <span class="sw"><span class="dot" style="background:#ff5c72"></span>sell</span>
      <span class="sw"><span class="dot" style="background:#ffb84d"></span>12 EMA while the ride is armed</span>
      <span class="sw"><span class="dot" style="background:#12351f"></span>uptrend</span>
      <span class="sw"><span class="dot" style="background:#3a1720"></span>downtrend</span>
    </div>
  </div>
</header>
<main id="list"></main>
<script>
const T = [
  {n:1, sym:'BTC', bars:4,  net:-2.43, note:'Four bars in a rolling-over market. The ride armed on a two-bar wiggle.'},
  {n:2, sym:'BTC', bars:2,  net:-0.36, note:'THE PROBLEM. Background is red the whole time, the EMA is flat, the ride is two bars long. This is chop, not a trend.'},
  {n:3, sym:'BTC', bars:67, net:19.95, note:'What it should look like. Buys at 64,395, the EMA turns up hard, rides 67 bars, out at 77,370.'},
  {n:4, sym:'ETH', bars:5,  net:-2.50, note:'Five bars, straight into a reversal.'},
  {n:5, sym:'ETH', bars:7,  net:-0.51, note:'Seven bars of nothing, exits near where it entered, pays the spread.'},
  {n:6, sym:'ETH', bars:31, net:8.76,  note:'A real ride: 31 bars up the EMA.'}
];
document.querySelector('#list').innerHTML = T.map(t => `
  <div class="t">
    <div class="hd">
      <span class="s">${t.sym} 1h</span>
      <span class="b">trade_${String(t.n).padStart(2,'0')} · held ${t.bars} bars</span>
      <span class="pl ${t.net>0?'up':'dn'}">${t.net>0?'+':''}${t.net.toFixed(2)}%</span>
    </div>
    <img src="/validation/trade_${String(t.n).padStart(2,'0')}.png" alt="trade ${t.n}">
    <div class="note">${t.note}</div>
  </div>`).join('');
</script>
</body>
</html>
