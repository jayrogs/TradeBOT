<!doctype html>
<html><head><meta charset="utf-8"><title>Backburners, live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0d0f12;--card:#14171c;--line:#252a33;--fg:#e6e9ee;--dim:#8b93a1;--up:#3ddc97;--dn:#ff5c72;--amber:#ffb84d;
        --mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1150px;margin:0 auto;padding:16px}
  .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  h1{font-size:22px;margin:0}
  h2{font-size:17px;margin:26px 0 8px}
  .small{font-size:12.5px;color:var(--dim);font-family:var(--mono)}
  input{background:#1a1e25;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 8px;font:14px var(--mono);width:110px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  .head{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
  .name{font-size:22px;font-weight:700}
  .kind{font-size:12px;color:var(--dim);margin-left:6px}
  .big{display:flex;flex-direction:column}
  .big .lab{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .big .val{font-size:22px;font-weight:700;font-family:var(--mono)}
  .green{color:var(--up)} .red{color:var(--dn)} .amber{color:var(--amber)}
  .more{font-size:13px;color:var(--dim);margin:2px 0 8px}
  img{width:100%;border-radius:10px;display:block}
  .none{color:var(--dim);padding:10px 2px}
  .marks{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .verdict{background:#1a1e25;border:1px solid var(--line);color:var(--dim);padding:7px 16px;border-radius:9px;cursor:pointer;user-select:none;font-size:14px}
  .verdict.on[data-v=good]{background:rgba(61,220,151,.15);border-color:var(--up);color:var(--up)}
  .verdict.on[data-v=bad]{background:rgba(255,92,114,.15);border-color:var(--dn);color:var(--dn)}
  input.note{flex:1;min-width:200px;width:auto;font:14px -apple-system,Segoe UI,Roboto,sans-serif}
  .saved{font-size:12px;color:var(--up);min-width:70px}
</style></head>
<body><div class="wrap">
  <div class="top">
    <h1>Backburners, live</h1>
    <div class="small">account $ <input id="acct" type="number" min="0" step="1000"> &middot; <span id="status"></span></div>
  </div>

  <h2>Waiting for the dip</h2>
  <div id="armed"></div>

  <h2>You're in</h2>
  <div id="open"></div>

  <div class="small" style="margin-top:28px">Refreshes every 15 minutes. The buy price moves each hour &mdash; use the newest one.
    Nothing here places an order. <a href="/backburners" style="color:var(--dim)">the rules</a></div>
</div>
<script>
const $ = s => document.querySelector(s);
const money = v => '$' + Math.round(v).toLocaleString();
const pr = v => v >= 100 ? v.toFixed(2) : v >= 1 ? v.toFixed(3) : v.toPrecision(4);
const mk = k => ({stock: 'stock', etf: 'fund', crypto: 'crypto', futures: 'future'}[k] || k);
let DATA = null;
function acct() { let v = 100000; try { v = parseFloat(localStorage.getItem('bb_acct')) || 100000; } catch (e) {} return v; }
function aged(x) {
  return x.data_age_h > 2 && (x.kind === 'futures' || x.kind === 'crypto')
    ? ` <span class="amber" style="font-size:12px">data ${x.data_age_h.toFixed(0)}h old</span>` : '';
}
const marks = id => `<div class="marks" data-id="${id}">
      <span class="verdict" data-v="good">good</span><span class="verdict" data-v="bad">bad</span>
      <input class="note" placeholder="comment (optional)"><span class="saved"></span></div>`;
let NOTES = {};
function wire() {
  document.querySelectorAll('.marks').forEach(m => {
    const id = m.dataset.id, prev = String(NOTES[id] || ''), i = prev.indexOf(' | ');
    const v = (i < 0 ? prev : prev.slice(0, i)).trim();
    m.querySelector('.note').value = i < 0 ? '' : prev.slice(i + 3);
    m.querySelectorAll('.verdict').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    const save = () => {
      const on = m.querySelector('.verdict.on'), txt = m.querySelector('.note').value;
      const body = (on ? on.dataset.v : '') + (txt ? ' | ' + txt : '');
      const sp = m.querySelector('.saved');
      const fail = () => { sp.textContent = 'NOT SAVED'; sp.style.color = 'var(--dn)'; };
      fetch('/api/tradenote', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({set: 'bblive', n: id, note: body})})
        .then(r => r.ok ? r.json() : null).then(j => {
          if (!j || !j.ok) return fail();
          NOTES[id] = body; sp.textContent = 'saved'; sp.style.color = '';
          setTimeout(() => { if (sp.textContent === 'saved') sp.textContent = ''; }, 1500);
        }).catch(fail);
    };
    m.querySelectorAll('.verdict').forEach(b => b.onclick = () => {
      const was = b.classList.contains('on');
      m.querySelectorAll('.verdict').forEach(x => x.classList.remove('on'));
      if (!was) b.classList.add('on');
      save();
    });
    let t = null;
    m.querySelector('.note').oninput = () => { clearTimeout(t); t = setTimeout(save, 600); };
  });
}
function render() {
  if (!DATA) return;
  const B = acct() / ((DATA.account && DATA.account.buckets) || 5);
  const mins = Math.round((Date.now() - new Date(DATA.updated.replace(' ', 'T')).getTime()) / 60000);
  $('#status').textContent = `updated ${mins} min ago`;
  const cap = (DATA.account && DATA.account.crypto_max_buckets) || 3;
  $('#armed').innerHTML = DATA.armed.length ? DATA.armed.map(a => {
    let used = 1;
    const more = (a.later || []).map(([lv, px]) => {
      let m = a.dollars ? (a.dollars[lv] || a.dollars[String(lv)] || 0) / (a.dollars[30] || a.dollars['30'] || 1) : 1;
      if (a.kind === 'crypto') { m = Math.max(0, Math.min(m, cap - used)); used += m; }
      return m > 0 ? `${money(B * m)} more at ${pr(px)}` : '';
    }).filter(Boolean).join(' &middot; ');
    return `<div class="card">
      <div class="head">
        <div><span class="name">${a.sym}</span><span class="kind">${mk(a.kind)}</span>${aged(a)}</div>
        <div class="big"><span class="lab">buy at</span><span class="val green">${pr(a.buy_at)}</span></div>
        <div class="big"><span class="lab">how much</span><span class="val">${money(B)}</span></div>
        <div class="big"><span class="lab">price has to drop</span><span class="val ${a.away > -3 ? 'amber' : ''}">${Math.abs(a.away).toFixed(1)}%</span></div>
      </div>
      ${more ? `<div class="more">if it keeps falling: ${more}</div>` : ''}
      ${a.chart ? `<img src="${a.chart}?v=${encodeURIComponent(DATA.updated)}" loading="lazy" alt="${a.sym}">` : ''}
      ${marks('armed|' + a.kind + '|' + a.sym + '|' + DATA.updated.slice(0, 10))}
    </div>`;
  }).join('') : `<div class="none">Nothing is set up right now.</div>`;
  $('#open').innerHTML = DATA.open.length ? DATA.open.map(t => `<div class="card">
      <div class="head">
        <div><span class="name">${t.sym}</span><span class="kind">${mk(t.kind)} &middot; bought ${t.bought.slice(5, 16)}</span>${aged(t)}</div>
        <div class="big"><span class="lab">since buy</span><span class="val ${t.pct_now >= 0 ? 'green' : 'red'}">${t.pct_now >= 0 ? '+' : ''}${t.pct_now.toFixed(2)}%</span></div>
        <div class="big"><span class="lab">sell half</span><span class="val amber">${t.half_sold ? 'done' : pr(t.half_at)}</span></div>
        <div class="big"><span class="lab">stop</span><span class="val red">${pr(t.stop)}</span></div>
      </div>
      ${t.chart ? `<img src="${t.chart}?v=${encodeURIComponent(DATA.updated)}" loading="lazy" alt="${t.sym}">` : ''}
      ${marks('open|' + t.kind + '|' + t.sym + '|' + t.bought.slice(0, 16))}
    </div>`).join('') : `<div class="none">No open trades.</div>`;
  wire();
}
const typing = () => document.activeElement && document.activeElement.classList.contains('note');
function load() {
  fetch('/api/bb_live?v=' + Date.now()).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => { DATA = d; if (!typing()) render(); })
    .catch(e => { $('#status').innerHTML = `<span class="red">no live data yet</span>`; });
}
const inp = $('#acct'); inp.value = acct();
inp.oninput = () => { try { localStorage.setItem('bb_acct', inp.value); } catch (e) {} render(); };
fetch('/api/tradenote?set=bblive').then(r => r.json()).catch(() => ({})).then(n => { NOTES = n || {}; load(); });
setInterval(load, 60000);
</script>
</body></html>
