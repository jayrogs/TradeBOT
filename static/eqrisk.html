<!doctype html>
<html><head><meta charset="utf-8"><title>Why the losers are bigger</title>
<style>
  :root{--bg:#0d0f12;--card:#14171c;--line:#252a33;--fg:#e6e9ee;--dim:#8b93a1;--faint:#5b6472;
        --up:#3ddc97;--dn:#ff5c72;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:22px 26px 4px;max-width:1500px}
  h1{font-size:21px;margin:0 0 4px}
  h2{font-size:16px;margin:26px 0 8px;color:var(--fg)}
  .sub{color:var(--dim);max-width:900px}
  main{padding:4px 26px 80px;max-width:1500px}
  img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:14px 0}
  .line{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-bottom:7px}
  .line b{color:var(--fg)}
  .win b{color:var(--up)} .loss b{color:var(--dn)}
  table{border-collapse:collapse;font-family:var(--mono);font-size:13px;margin:10px 0 0}
  th,td{padding:6px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--faint);font-weight:500}
  td.l,th.l{text-align:left}
  #zoom{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:30;cursor:zoom-out;padding:8px}
  #zoom img{max-width:99vw;max-height:98vh;width:auto;cursor:zoom-out}
</style></head>
<body>
<header>
  <h1>Why the losers are bigger than the winners</h1>
  <div class="sub">The EQ trade lined up with the hourly: buy the next open, stop at the hourly higher low (red), half off at 1x the risk (orange circle), sell the rest at the hourly's last high (green). Focus list.</div>
</header>
<main>
  <div class="card"><img id="summary" src="/validation/eq_risk/summary.png" alt="risk against reward"></div>
  <table id="nums"></table>
  <h2>The winners</h2><div id="wins"></div>
  <h2>The losers</h2><div id="losses"></div>
</main>
<div id="zoom"></div>
<script>
const $ = s => document.querySelector(s);
const pc = v => (v > 0 ? '+' : '') + v.toFixed(2) + '%';
fetch('/validation/eq_risk/eq_risk_index.json?v=' + Date.now()).then(r => r.json()).then(d => {
  const s = d.stats;
  $('#nums').innerHTML = `<tr><th class="l">on ${s.n} trades</th><th></th></tr>`
    + [['trades won', (100 * s.won).toFixed(0) + '%'],
       ['the average win', pc(s.avg_win)],
       ['the average loss', pc(s.avg_loss)],
       ['the stop sits away', s.median_risk.toFixed(2) + '%'],
       ['the target sits away', s.median_target.toFixed(2) + '%'],
       ['target closer than the stop', (100 * s.share_target_under_risk).toFixed(0) + '% of trades'],
       ['so, per trade', pc(s.avg)]].map(([a, b]) => `<tr><td class="l">${a}</td><td>${b}</td></tr>`).join('');
  const card = c => `<div class="card ${c.pct > 0 ? 'win' : 'loss'}">
      <div class="line">${c.sym} <span style="color:var(--faint)">${c.tf} ${c.side > 0 ? 'long' : 'short'}</span> &middot; ${c.t}
        &middot; risked <b>${c.risk_pct.toFixed(2)}%</b> &middot; aimed <b>${c.target_pct.toFixed(2)}%</b>
        &middot; <b>${pc(c.pct)}</b> &middot; ${c.how}</div>
      <img src="/validation/eq_risk/${c.png}?v=${Date.now()}" loading="lazy" alt="${c.sym} ${c.tf}"></div>`;
  $('#wins').innerHTML = d.charts.filter(c => c.pct > 0).map(card).join('');
  $('#losses').innerHTML = d.charts.filter(c => c.pct <= 0).map(card).join('');
  document.querySelectorAll('img').forEach(im => im.onclick = () => {
    const z = $('#zoom'); z.innerHTML = `<img src="${im.getAttribute('src')}">`; z.style.display = 'flex';
  });
});
$('#zoom').onclick = () => { $('#zoom').style.display = 'none'; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#zoom').style.display = 'none'; });
</script>
</body></html>
